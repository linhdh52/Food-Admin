<div class="row">
  <div class="col-md-12 stretch-card">
    <div class="card">
      <div class="card-body">
        <h6 class="card-title">Danh sách danh mục</h6>
        <div class="row">
          <div class="col-xl-3 col-md-4">
            <input type="text" class="form-control form-control-sm" placeholder="Nhập tên danh mục cần tìm" (keyup)="updateFilter($event)"/>
          </div>
        </div>
        <div class="table-responsive">
          <ngx-datatable
            #table
            class="bootstrap"
            [rows]="rows"
            [loadingIndicator]="loadingIndicator"
            [columnMode]="ColumnMode.force"
            [footerHeight]="50"
            [limit]="10"
            rowHeight="auto">
            <ngx-datatable-column name="ID"></ngx-datatable-column>
            <ngx-datatable-column name="Tên danh mục" prop="name"></ngx-datatable-column>
            <ngx-datatable-column name="Mô tả" prop="description"></ngx-datatable-column>
            <ngx-datatable-column name="Đường dẫn web" prop="slug"></ngx-datatable-column>
            <ngx-datatable-column name="Menu cấp" prop="parentId"></ngx-datatable-column>
            <ngx-datatable-column name="State" prop="address.state"></ngx-datatable-column>
          </ngx-datatable>
        </div>
      </div>
    </div>
  </div>
</div>

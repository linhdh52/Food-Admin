<div class="row">
  <div class="col-md-12 stretch-card">
    <div class="card">
      <div class="card-body">
        <h6 class="card-title">Danh sách danh mục</h6>
        <div class="row">
          <div class="col-xl-3 col-md-4">
            <input type="text" class="form-control form-control-sm" placeholder="Nhập tên danh mục cần tìm"
                   (keyup)="updateFilter($event)"/>
          </div>
        </div>
        <div class="table-responsive">
          <ngx-datatable
            #table
            class="bootstrap"
            [rows]="rows"
            [loadingIndicator]="loadingIndicator"
            [columnMode]="ColumnMode.force"
            [footerHeight]="50"
            [limit]="10"
            rowHeight="auto"
            [messages]="{
              emptyMessage: 'Không có dữ liệu',
              totalMessage: 'danh mục',
              selectedMessage: 'được chọn'
            }"
            [selectionType]="SelectionType.checkbox"
            [selected]="selected"
            (select)="onSelect($event)">
            <ngx-datatable-column
              [width]="48"
              [sortable]="false"
              [canAutoResize]="false"
              [draggable]="false"
              [resizeable]="false"
              [headerCheckboxable]="true"
              [checkboxable]="true">
            </ngx-datatable-column>
            <ngx-datatable-column name="ID"></ngx-datatable-column>
            <ngx-datatable-column name="Tên danh mục" prop="name"></ngx-datatable-column>
            <ngx-datatable-column name="Mô tả" prop="description"></ngx-datatable-column>
            <ngx-datatable-column name="Đường dẫn web" prop="slug"></ngx-datatable-column>
            <ngx-datatable-column name="Menu cấp" prop="parentId">
              <ng-template ngx-datatable-cell-template let-row="row" let-value="value">
                Menu cấp {{ value + 1 }}
              </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column name="Trạng thái" prop="active">
              <ng-template ngx-datatable-cell-template let-row="row" let-value="value">
                {{ value === true ? 'Hoạt động' : 'Dừng' }}
              </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column
              [sortable]="false" [canAutoResize]="false" [draggable]="false" [resizeable]="false"
              [cellClass]="'text-nowrap'">

              <ng-template ngx-datatable-cell-template let-row="row">
                <div class="d-flex justify-content-end align-items-center gap-1">

                  <button class="btn btn-sm btn-primary" (click)="onEdit(row); $event.stopPropagation()">
                    <i class="feather icon-edit me-1"></i>
                  </button>

                  <button class="btn btn-sm btn-danger" (click)="onDelete(row); $event.stopPropagation()">
                    <i class="feather icon-trash-2 me-1"></i>
                  </button>
                </div>
              </ng-template>
            </ngx-datatable-column>
          </ngx-datatable>
        </div>
      </div>
    </div>
  </div>
</div>

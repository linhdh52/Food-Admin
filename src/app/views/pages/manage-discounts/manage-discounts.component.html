<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a routerLink=".">Quản lý sản phẩm</a></li>
    <li class="breadcrumb-item active" aria-current="page">Chương trình khuyến mãi giảm giá</li>
  </ol>
</nav>
<div class="row">
  <div class="col-md-12 stretch-card">
    <div class="card">
      <div class="card-body">
        <h6 class="card-title">Danh sách các Chương trình khuyến mãi giảm giá</h6>
        <div class="row">
          <div class="col-xl-3 col-md-4">
            <input type="text" class="form-control form-control-sm"
                   placeholder="Nhập tên chương trình giảm giá cần tìm"
                   (keyup)="updateFilter($event)"/>
          </div>
          <div class="col-xl-3 col-md-4 ms-auto text-end">
            <button class="btn btn-sm btn-outline-primary mb-2 me-2" (click)="openTop(template)">
              <i class="feather icon-plus-circle me-1"></i>Thêm mới chương trình
            </button>
          </div>
        </div>
        <div class="table-responsive">
          <ngx-datatable
            #table
            class="bootstrap"
            [rows]="rows"
            [loadingIndicator]="loadingIndicator"
            [columnMode]="ColumnMode.force"
            [scrollbarH]="true"
            [scrollbarV]="false"
            [headerHeight]="50"
            [footerHeight]="50"
            [limit]="10"
            rowHeight="auto"
            [messages]="{
              emptyMessage: 'Không có dữ liệu',
              totalMessage: 'voucher',
              selectedMessage: 'được chọn'
            }"
            [selectionType]="SelectionType.checkbox"
            [selected]="selected"
            (select)="onSelect($event)">
            <ngx-datatable-column
              [width]="48"
              [sortable]="false"
              [canAutoResize]="false"
              [draggable]="false"
              [resizeable]="false"
              [headerCheckboxable]="true"
              [checkboxable]="true">
            </ngx-datatable-column>
            <ngx-datatable-column
              name="ID"
              prop="id"
              [width]="idColW"
              [canAutoResize]="false"
              [resizeable]="false">
            </ngx-datatable-column>
            <ngx-datatable-column name="Mã khuyến mãi" prop="code"></ngx-datatable-column>
            <ngx-datatable-column name="Tên chương trình" prop="name"></ngx-datatable-column>
            <ngx-datatable-column name="Mô tả" prop="description"></ngx-datatable-column>
            <ngx-datatable-column name="Phạm vi" prop="scope"></ngx-datatable-column>
            <ngx-datatable-column name="Kiểu giảm giá" prop="discountType"></ngx-datatable-column>
            <ngx-datatable-column name="Giá trị giảm" prop="discountValue"></ngx-datatable-column>
            <ngx-datatable-column name="Giá trị đơn tối thiểu" prop="minOrderValue"></ngx-datatable-column>
            <ngx-datatable-column name="Mức giảm tối đa" prop="maxDiscount"></ngx-datatable-column>
            <ngx-datatable-column name="Có cho cộng dồn với mã khác không" prop="stackable"></ngx-datatable-column>
            <ngx-datatable-column name="Mức" prop="maxDiscount"></ngx-datatable-column>
            <ngx-datatable-column name="Độ ưu tiên áp dụng" prop="priority"></ngx-datatable-column>
            <ngx-datatable-column name="Tổng số lần dùng toàn hệ thống" prop="usageLimit"></ngx-datatable-column>
            <ngx-datatable-column name="Số lần đã dùng" prop="usedCount"></ngx-datatable-column>
            <ngx-datatable-column name="Số lần tối đa mỗi user được dùng" prop="maxUsagePerUser"></ngx-datatable-column>
            <ngx-datatable-column name="Thời điểm bắt đầu" prop="startDate"></ngx-datatable-column>
            <ngx-datatable-column name="Thời điểm kết thúc" prop="endDate"></ngx-datatable-column>
            <ngx-datatable-column name="Danh sách ngày trong tuần" prop="dayOfWeek"></ngx-datatable-column>
            <ngx-datatable-column name="Danh sách user được áp dụng" prop="userId"></ngx-datatable-column>
            <ngx-datatable-column name="Giờ bắt đầu áp dụng trong ngày" prop="startTime"></ngx-datatable-column>
            <ngx-datatable-column name="Giờ kết thúc áp dụng trong ngày" prop="endTime"></ngx-datatable-column>
            <ngx-datatable-column name="Trạng thái" prop="active">
              <ng-template ngx-datatable-cell-template let-row="row" let-value="value">
                {{ value === true ? 'Hoạt động' : 'Dừng' }}
              </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column name="Thời gian chỉnh sửa" prop="updateDate">
              <ng-template ngx-datatable-cell-template let-row="row" let-value="value">
                {{ value | date:'short' }}
              </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column
              [sortable]="false" [canAutoResize]="false" [draggable]="false" [resizeable]="false" [frozenRight]="true"
              [cellClass]="'text-nowrap'">

              <ng-template ngx-datatable-cell-template let-row="row">
                <div class="d-flex justify-content-end align-items-center gap-1">

                  <button class="btn btn-sm btn-primary" (click)="onEdit(row, template); $event.stopPropagation()">
                    <i class="feather icon-edit me-1"></i>
                  </button>

                  <button class="btn btn-sm btn-danger" (click)="onDelete(row); $event.stopPropagation()">
                    <i class="feather icon-trash-2 me-1"></i>
                  </button>
                </div>
              </ng-template>
            </ngx-datatable-column>
          </ngx-datatable>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #template let-offcanvas>
  <div class="offcanvas-header d-flex justify-content-center position-relative">
    <h4 class="offcanvas-title m-0" *ngIf="!isEdit">Thêm mới chương trình giảm giá</h4>
    <h4 class="offcanvas-title m-0" *ngIf="isEdit">Chỉnh sửa chương trình giảm giá</h4>
    <button type="button" class="btn btn-close position-absolute end-0 me-3"
            aria-label="Close"
            (click)="offcanvas.dismiss('Cross click')"></button>
  </div>

  <div class="offcanvas-body border-top">
    <form [formGroup]="discountForm">
      <div class="mb-3" *ngIf="isEdit">
        <label class="form-label">ID</label>
        <input type="text" class="form-control" formControlName="id">
      </div>

      <div class="mb-3">
        <label class="form-label">Mã chương trình giảm giá</label>
        <input type="text" class="form-control" formControlName="code" placeholder="Nhập mã chương trình">
      </div>

      <div class="mb-3">
        <label class="form-label">Tên chương trình giảm giá</label>
        <input type="text" class="form-control" formControlName="name" placeholder="Nhập tên chương trình giảm giá">
      </div>

      <div class="mb-3">
        <label class="form-label">Mô tả</label>
        <textarea class="form-control" rows="3" formControlName="description" placeholder="Nhập mô tả"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Phạm vi áp dụng</label>
        <select class="form-select" formControlName="scope" (change)="selectedScope($event)">
          <ng-container *ngFor="let item of LIST_SCOPE">
            <option [ngValue]="item.id">
              {{ item.name }}
            </option>
          </ng-container>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Kiểu giảm</label>
        <select class="form-select" formControlName="discountType" (change)="selectedScope($event)">
          <ng-container *ngFor="let item of LIST_DISCOUNT_TYPE">
            <option [ngValue]="item.id">
              {{ item.name }}
            </option>
          </ng-container>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Giá trị giảm</label>
        <input type="text" class="form-control" formControlName="discountValue" placeholder="Nhập giá trị giảm">
      </div>

      <div class="mb-3">
        <label class="form-label">Giá trị đơn tối thiểu</label>
        <input type="text" class="form-control" formControlName="minOrderValue"
               placeholder="Nhập giá trị đơn tối thiểu">
      </div>

      <div class="mb-3">
        <label class="form-label">Mức giảm tối đa</label>
        <input type="text" class="form-control" formControlName="maxDiscount" placeholder="Nhập mức giảm tối đa">
      </div>

      <div class="mb-3">
        <label class="form-label">Giá trị giảm</label>
        <input type="text" class="form-control" formControlName="discountValue" placeholder="Nhập giá trị giảm">
      </div>

      <div class="mb-3">
        <label class="form-label">Có cho cộng dồn với mã khác không</label>
        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" formControlName="stackable" id="stackableSwitch">
          <label class="form-check-label"
                 for="stackableSwitch">{{ discountForm.get('stackable')?.value === true ? 'Có' : 'Không' }}</label>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Giá trị giảm</label>
        <input type="text" class="form-control" formControlName="discountValue" placeholder="Nhập giá trị giảm">
      </div>

      <div class="mb-3">
        <label class="form-label">Giá trị giảm</label>
        <input type="text" class="form-control" formControlName="discountValue" placeholder="Nhập giá trị giảm">
      </div>

      <div class="mb-3">
        <label class="form-label">Giá trị giảm</label>
        <input type="text" class="form-control" formControlName="discountValue" placeholder="Nhập giá trị giảm">
      </div>

      <div class="mb-3">
        <label class="form-label">Giá trị giảm</label>
        <input type="text" class="form-control" formControlName="discountValue" placeholder="Nhập giá trị giảm">
      </div>

      <div class="mb-3">
        <label class="form-label">Giá trị giảm</label>
        <input type="text" class="form-control" formControlName="discountValue" placeholder="Nhập giá trị giảm">
      </div>

      <div class="mb-3">
        <label class="form-label">Trạng thái</label>
        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" formControlName="active" id="activeSwitch">
          <label class="form-check-label"
                 for="activeSwitch">{{ discountForm.get('active')?.value === true ? 'Hoạt động' : 'Dừng' }}</label>
        </div>
      </div>

    </form>

  </div>

  <div class="offcanvas-footer border-top p-3 d-flex justify-content-center gap-2">
    <button type="button" class="btn btn-outline-danger" (click)="resetForm()">
      <i class="feather icon-delete me-1"></i> Nhập lại
    </button>
    <button type="button" class="btn btn-outline-primary" [disabled]="discountForm.invalid" (click)="saveCategory()">
      <i class="feather icon-send me-1"></i>Lưu
    </button>
    <button type="button" class="btn btn-outline-danger" (click)="offcanvas.dismiss('Close click')">
      <i class="feather icon-log-out me-1"></i>Hủy
    </button>
  </div>
</ng-template>
